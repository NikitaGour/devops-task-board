name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devopsdb
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d devopsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://devops:devops_local_only@localhost:5432/devopsdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
