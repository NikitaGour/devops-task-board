stages:
  - test

backend_tests:
  stage: test
  tags:
    - mac-runner
  variables:
    NODE_ENV: "test"
    DATABASE_URL: "postgres://devops:devops_local_only@localhost:5432/devopsdb"
  before_script:
    - docker compose up -d db
    - cd backend
    - npm ci
    - until docker exec devops-task-db pg_isready -U devops -d devopsdb; do sleep 2; done
  script:
    - npm test
