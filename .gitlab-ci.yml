
stages:
  - test

backend_tests:
  stage: test
  tags:
    - mac-runner
  image: node:22-alpine

  services:
    - name: postgres:17-alpine
      alias: db

  variables:
    POSTGRES_DB: devopsdb
    POSTGRES_USER: devops
    POSTGRES_PASSWORD: devops_local_only
    DATABASE_URL: "postgres://devops:devops_local_only@db:5432/devopsdb"
    NODE_ENV: test
    PGPASSWORD: devops_local_only

  before_script:
    - apk add --no-cache postgresql-client
    - cd backend
    - npm ci
    - until pg_isready -h db -p 5432 -U devops -d devopsdb; do sleep 2; done

  script:
    - npm test

